<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oser | 3D Business Cards Directory</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #ffffff, #ffd97d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: rgba(255, 255, 255, 0.55);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 960px;
        }

        .card-link {
            background: rgba(16, 22, 42, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 16px;
            text-decoration: none;
            color: #ffffff;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-link:hover {
            transform: translateY(-6px);
            border-color: rgba(212, 160, 36, 0.75);
            box-shadow: 0 16px 36px rgba(212, 160, 36, 0.15);
        }

        .card-link img {
            width: 100%;
            aspect-ratio: 1059 / 600;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .info h2 {
            font-size: 1.15rem;
            margin-bottom: 4px;
        }

        .info p {
            font-size: 0.85rem;
            color: #eab308;
        }

        .url-badge {
            margin-top: 4px;
            display: inline-block;
            font-family: monospace;
            font-size: 0.78rem;
            color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>To dare, To Oser</h1>
        <p>Select a team member's 3D interactive business card</p>
    </div>

    <div class="grid">
        {% for card in cards %}
        <a href="/{{ card.slug }}" class="card-link">
            <img src="/images/{{ card.filename }}" alt="{{ card.name }}">
            <div class="info">
                <h2>{{ card.name }}</h2>
                <p>{{ card.role }}</p>
                <span class="url-badge">/{{ card.slug }}</span>
            </div>
        </a>
        {% endfor %}
    </div>

</body>
</html>
